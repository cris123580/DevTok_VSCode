<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevTok - Home</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="logo" href="index.html"><span>&lt;/&gt;</span> Dev<strong>Tok</strong></a>
      <button id="searchBtn" class="icon-btn" aria-label="Zoeken">⌕</button>
    </header>

    <div id="searchBox" class="search-box hidden">
      <input id="searchInput" type="search" placeholder="Zoek een bericht..." autocomplete="off">
    </div>

    <div class="categories">
      <button class="category active" data-category="Alle">Alle</button>
      <button class="category" data-category="PHP">PHP</button>
      <button class="category" data-category="JavaScript">JavaScript</button>
      <button class="category" data-category="VueJS">VueJS</button>
    </div>

    <main id="posts" class="feed">
      <div class="loading">Berichten laden...</div>
    </main>

    <nav class="bottom-nav">
      <a class="active" href="index.html"><span>⌂</span><small>Home</small></a>
      <a href="#new" id="newBtn"><span>＋</span><small>Nieuw</small></a>
      <a href="#profile"><span>○</span><small>Profiel</small></a>
    </nav>
  </div>

  <div id="toast" class="toast"></div>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
