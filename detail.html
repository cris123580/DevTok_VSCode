<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevTok - Bericht</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar detailbar">
      <a class="icon-btn" href="index.html" aria-label="Terug">←</a>
      <a class="logo" href="index.html"><span>&lt;/&gt;</span> Dev<strong>Tok</strong></a>
      <span class="header-space"></span>
    </header>

    <main class="detail-page">
      <section id="post-detail" class="detail-card">
        <div class="loading">Bericht laden...</div>
      </section>

      <section class="comments-section">
        <div class="section-title">
          <h2>Reacties <span id="count"></span></h2>
        </div>

        <div id="comments"></div>

        <form id="comment-form" class="comment-form">
          <input id="name" type="text" placeholder="Je naam" maxlength="40" required>
          <div class="comment-row">
            <input id="text" type="text" placeholder="Schrijf een reactie..." maxlength="300" required>
            <button type="submit" aria-label="Reactie plaatsen">➤</button>
          </div>
          <p id="message"></p>
        </form>
      </section>
    </main>

    <nav class="bottom-nav">
      <a class="active" href="index.html"><span>⌂</span><small>Home</small></a>
      <a href="index.html"><span>＋</span><small>Nieuw</small></a>
      <a href="#profile"><span>○</span><small>Profiel</small></a>
    </nav>
  </div>

  <script src="js/config.js"></script>
  <script src="js/detail.js"></script>
</body>
</html>
